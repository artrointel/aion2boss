name: Mirror field boss cache

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-field-boss-cache
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mirror NotMeter field boss cache
        run: node scripts/mirror-field-boss-cache.mjs

      - name: Commit mirrored cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '필드보스 캐시 미러링'
          file_pattern: 'public/api/notmeter-field-boss-public.json docs/api/notmeter-field-boss-public.json'
