name: Mirror local NotMeter field boss cache

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: field-boss-cache-publish
  cancel-in-progress: false

jobs:
  mirror-local:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnose NotMeter local cache access
        shell: cmd
        env:
          FIELD_BOSS_LOCAL_CACHE_PATH: ${{ vars.FIELD_BOSS_LOCAL_CACHE_PATH || 'C:\Users\battl\AppData\Local\Not4You-Meter\field-boss-server-cache.json' }}
        run: |
          whoami
          echo FIELD_BOSS_LOCAL_CACHE_PATH=%FIELD_BOSS_LOCAL_CACHE_PATH%
          if exist "%FIELD_BOSS_LOCAL_CACHE_PATH%" (
            echo NotMeter cache file exists.
            dir "%FIELD_BOSS_LOCAL_CACHE_PATH%"
          ) else (
            echo NotMeter cache file is not visible to this runner account.
            if exist "C:\Users\battl\AppData\Local\Not4You-Meter" (
              dir "C:\Users\battl\AppData\Local\Not4You-Meter"
            ) else (
              echo NotMeter directory is not visible to this runner account.
            )
          )

      - name: Mirror local NotMeter field boss cache
        shell: cmd
        env:
          FIELD_BOSS_LOCAL_CACHE_PATH: ${{ vars.FIELD_BOSS_LOCAL_CACHE_PATH || 'C:\Users\battl\AppData\Local\Not4You-Meter\field-boss-server-cache.json' }}
        run: node scripts/mirror-local-field-boss-cache.mjs

      - name: Publish mirror branch
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd .field-boss-cache
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B field-boss-cache
          git add api/notmeter-field-boss-public.json
          git diff --cached --quiet
          if %ERRORLEVEL% EQU 0 (
            echo No field boss cache changes to publish.
            exit /b 0
          )
          git commit -m "Mirror local NotMeter field boss cache"
          git push --force "https://x-access-token:%GITHUB_TOKEN%@github.com/%GITHUB_REPOSITORY%.git" HEAD:field-boss-cache
